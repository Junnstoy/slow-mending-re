name: Build

on:
  push:
    branches: [main, 'compat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin and run unit tests
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Compile the Paper integration test plugin
        run: mvn --batch-mode --no-transfer-progress -f integration-tests/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: slow-mending-re-2.2.0-paper-26.3
          path: target/slow-mending-re-2.2.0.jar
          if-no-files-found: error
